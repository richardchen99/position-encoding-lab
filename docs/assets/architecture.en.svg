<text x="88" y="830" font-size="23" style="fill:#586B77" class="">Scaled scores → causal softmax → normalized weights over visible keys</text>
<text x="64" y="902" font-size="19" style="fill:#4E7E9D" class="small">CONTROL: SHIFT BOTH POSITIONS TOGETHER</text>
<text x="64" y="945" font-size="23" style="fill:#586B77" class="">Sinusoidal: cross terms can change.</text>
<text x="64" y="980" font-size="23" style="fill:#586B77" class="">RoPE / ALiBi: check invariance under the fixed rules above.</text>
