<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
<title id="title">Three ways to put position into attention</title><desc id="desc">Hold content fixed; vary the position rule and inspect the resulting attention row.</desc>
