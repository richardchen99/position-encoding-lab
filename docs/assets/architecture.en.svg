<text x="88" y="253" font-size="27" style="fill:#22313D" class="" font-weight="600">Controlled input</text>
<text x="88" y="291" font-size="23" style="fill:#586B77" class="">Fixed 8D content vectors  ·  Query / Key positions  ·  Shared causal window</text>
