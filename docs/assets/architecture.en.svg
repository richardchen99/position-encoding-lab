<text x="64" y="121" font-size="45" style="fill:#22313D" class="display">Three ways to put position into attention</text>
<text x="64" y="165" font-size="23" style="fill:#586B77" class="">Hold content fixed; vary the position rule and inspect the resulting attention row.</text>
